name: Release

# Pushing a `v<version>` tag publishes a GitHub Release with both VSIX files. Push `main`
# before the tag: the release does not run the tests itself, it waits for the CI workflow's
# run on the tagged commit and fails unless that run's latest attempt concluded `success`.
# After a red CI, re-run the failed jobs of that CI run, then re-run this workflow.
# A manual run must be started from that tag (Use workflow from: Tags), not from a branch,
# unless it only publishes an existing GitHub Release to the Marketplace (input below).
#
# The `marketplace` job then publishes the same two VSIX files, downloaded from that
# GitHub Release, to the Visual Studio Marketplace. It signs in with Microsoft Entra ID
# through GitHub OIDC (no stored secret) in the `marketplace` environment; see
# docs/publishing.md#authentication. An already published version is skipped, so a
# re-run after a failed Marketplace step is safe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      marketplace_tag:
        description: "Only publish the existing GitHub Release of this tag (v<version>) to the Marketplace"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.marketplace_tag }}
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Refuse a run that is not on a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a v<version> tag, not from ${{ github.ref_name }}."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag and extract its release notes
        # The notes stay outside the checkout: vsce would otherwise package them into the VSIX.
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" "$env:RUNNER_TEMP/release-notes.md"
      - run: npm ci
      - name: Wait for a green CI run on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # The CI run may not exist yet when the tag arrives together with `main`: no run yet is waiting, not failing.
          deadline=$((SECONDS + 3600))
          while :; do
            row=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=20" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | if . == null then "" else "\(.status) \(.conclusion // "-") \(.html_url)" end') || row=""
            read -r status conclusion url <<< "$row" || true
            if [ -z "${status:-}" ]; then
              echo "No CI run for $SHA yet."
            elif [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI is green for $SHA: $url"
                break
              fi
              echo "::error::CI concluded '$conclusion' for $SHA ($url). Re-run the failed jobs of that CI run, then re-run this workflow."
              exit 1
            else
              echo "CI is $status for $SHA: $url"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No finished CI run for $SHA within an hour."
              exit 1
            fi
            sleep 30
          done
      - run: npm run vsix:all
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" \
            "out/omp-desk-win32-x64-$version.vsix" \
            "out/omp-desk-win32-arm64-$version.vsix" \
            --verify-tag \
            --title "OMP Desk $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  marketplace:
    needs: release
    # Runs after a successful release, or alone when a manual run names an existing release.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (needs.release.result == 'skipped' && inputs.marketplace_tag != '')) }}
    runs-on: windows-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the released VSIX files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.marketplace_tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a v<major>.<minor>.<patch> tag."
            exit 1
          fi
          gh release download "$TAG" --pattern "*.vsix" --dir "$RUNNER_TEMP/vsix"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Check publish rights for the publisher
        run: npx vsce verify-pat hmmvot --azure-credential
      - name: Publish to the Marketplace
        shell: bash
        env:
          TAG: ${{ inputs.marketplace_tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          npx vsce publish --azure-credential --skip-duplicate --packagePath \
            "$RUNNER_TEMP/vsix/omp-desk-win32-x64-$version.vsix" \
            "$RUNNER_TEMP/vsix/omp-desk-win32-arm64-$version.vsix"
